<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d23f86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170d14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Révisions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Révisions L1 LEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study app: calm, warm, precise
   IDEA a personal study planner app: soft pink paper surfaces, one rose ink, each subject keeps its own colour tab
   PICTURE the progress ring and the subject cards on the dashboard; the question card in quizzes
   COLOUR soft pink ground, white cards, plum ink, rose accent; dark: deep plum night; subject colours as accents
   TYPE Plus Jakarta Sans for everything, Noto Naskh Arabic for Arabic
   LAYOUT laptop: left sidebar + content column; phone: top bar, content, bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#fcf5f8,#170d14);--surf:light-dark(#ffffff,#22141e);--surf2:light-dark(#f8e9f0,#2d1a27);
--ink:light-dark(#2a1622,#f6e9f0);--mut:light-dark(#7c6170,#c4a6b6);--line:light-dark(#f0dbe5,#3a2232);
--accent:light-dark(#d23f86,#ff8ec4);--accent-soft:light-dark(#fde4ef,#3f1d33);--on:light-dark(#fff,#2a0f1f);
--ok:light-dark(#1f8a55,#4fd295);--ko:light-dark(#c8453a,#ff8678);--warn:light-dark(#b9770e,#ffc261);
--sh:0 1px 2px rgba(120,30,80,.05),0 6px 24px -12px rgba(140,30,90,.20);--r:18px}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro",serif;font-size:1.15em;line-height:1.75;unicode-bidi:isolate}
.small{font-size:13.5px}.muted{color:var(--mut)}.grow{flex:1}.m0{margin:0}.center{text-align:center;justify-content:center}.between{justify-content:space-between}
.lnk{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.015em;margin:0 0 10px}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;text-wrap:balance}
h2.sec{font-size:21px;margin:30px 0 12px}
h3{font-size:17px;font-weight:700}
h4{font-size:15px;margin-top:14px}
.ttl{margin-top:6px}
.lead{color:var(--mut);font-size:16.5px;max-width:720px;margin:0 0 18px}
.eyebrow{font-size:13.5px;color:var(--mut);font-weight:600;margin:0 0 6px}
/* shell */
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;z-index:5}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;line-height:1.25}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800;flex:none}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--mut);transition:background .15s,color .15s}
.side nav a:hover{background:var(--surf2);color:var(--ink)}
.side nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.ni{width:22px;text-align:center;font-size:17px}
.due-badge{margin-left:auto;background:var(--accent);color:var(--on);border-radius:999px;font-size:12px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding:0 8px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}.sync.cloud{background:var(--ok)}.sync.wait{background:var(--warn)}
.mtop,.bottom{display:none}
main{margin-left:236px;padding:28px clamp(18px,4vw,48px) 60px;max-width:1180px}
main.in{animation:fade .28s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
/* cards */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>.card{margin-bottom:0}.grid2{margin-bottom:16px}.grid2.tight{gap:12px;margin:8px 0 0}
.btn{border:0;border-radius:12px;padding:11px 18px;min-height:44px;background:var(--accent);color:var(--on);font-weight:700;transition:transform .12s,filter .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.98)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cnt{background:var(--accent);color:var(--on);border-radius:999px;padding:0 8px;font-size:13px}
.back{background:none;border:0;color:var(--mut);font-weight:600;padding:6px 0;margin-bottom:8px;min-height:40px}
.back:hover{color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--accent-soft);z-index:0}
.hero>*{position:relative;z-index:1}
.ring-box{display:flex;flex-direction:column;align-items:center;gap:6px}.ring{width:190px;height:190px}.ring-bg{fill:none;stroke:var(--surf2);stroke-width:12}.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s ease}
.ring-n{font-size:26px;font-weight:800;fill:var(--ink)}.ring-l{font-size:11.5px;fill:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:clamp(22px,3vw,28px);font-weight:800;line-height:1.1}.kpi b small{font-size:15px;color:var(--mut);font-weight:600}
.kpi span{font-size:13.5px;color:var(--mut)}
.reco{background:linear-gradient(135deg,var(--accent-soft),var(--surf) 70%)}
.goal{margin:10px 0}.goal-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.goal-h span:last-child{white-space:nowrap;color:var(--mut)}
.bar{display:block;height:8px;border-radius:8px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--c,var(--accent));transition:width .6s ease}
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px}
.li:first-of-type{border-top:0}
button.li:hover{background:var(--surf2);border-radius:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.dot.sm{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.hist,.tasks,.notes{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.hist li:first-child{border-top:0}
.task,.notes li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.task:first-child,.notes li:first-child{border-top:0}
.task label,.notes label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer}
.task input,.notes input,.ck input,.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.task.done span,.notes .done span{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:2px 6px;min-height:32px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.subj:hover{transform:translateY(-2px);border-color:var(--c)}
.subj b{display:block;font-size:16px}.subj .bar{margin-top:8px}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surf));color:var(--c);font-weight:800;font-size:18px;flex:none;font-family:"Plus Jakarta Sans","Noto Naskh Arabic",sans-serif}
.ico.big{width:64px;height:64px;font-size:28px;background:rgba(255,255,255,.2);color:#fff;border-radius:18px}
.pc{font-weight:800;color:var(--c)}
/* subject & chapter */
.shead{display:flex;gap:18px;align-items:center;background:var(--c);color:#fff;border-radius:24px;padding:24px;margin-bottom:16px}
.shead h1{color:#fff;margin-bottom:4px}.shead .bar{background:rgba(255,255,255,.25);margin-top:10px}
.exam summary{cursor:pointer;list-style:none}.exam summary::after{content:" ▾";color:var(--mut)}.exam p{margin:10px 0 0}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.act{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.act:hover{border-color:var(--accent);transform:translateY(-1px)}
.act b{display:block}.act span{font-size:13.5px;color:var(--mut)}
.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chap{position:relative}
.chap-main{width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:14px 44px 14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .15s}
.chap-main:hover{transform:translateY(-1px)}
.chap-n{font-size:12.5px;font-weight:700;color:var(--c)}
.star{position:absolute;top:10px;right:10px;background:none;border:0;font-size:20px;color:var(--mut);min-height:36px;min-width:36px}.star.on{color:#f0a500}.star.big{position:static;font-size:26px;color:#fff;opacity:.85}.star.big.on{color:#ffd54a}
.lvl{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surf2);color:var(--mut)}
.lvl.l1{background:light-dark(#eef2ff,#232a52);color:var(--accent)}.lvl.l2{background:light-dark(#fff3dc,#3b2f16);color:var(--warn)}.lvl.l3{background:light-dark(#e3f4ff,#14324a);color:light-dark(#1769aa,#7cc4ff)}.lvl.l4{background:light-dark(#dff5e9,#123526);color:var(--ok)}
.chead{display:flex;gap:16px;align-items:flex-start;background:var(--c);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}
.chead h1{color:#fff;font-size:clamp(24px,3.6vw,34px)}.chead .eyebrow{color:rgba(255,255,255,.85)}.chead .lvl{background:rgba(255,255,255,.9)}
.tabs{display:flex;gap:6px;background:var(--surf2);padding:5px;border-radius:14px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap;min-height:42px}
.tabs button[aria-selected=true]{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
.retenir{background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--surf));border:1.5px solid color-mix(in srgb,var(--c,var(--accent)) 40%,transparent);border-radius:16px;padding:14px 18px;margin-bottom:18px}
.retenir b,.resume b{font-size:13.5px;text-transform:none;color:var(--c,var(--accent))}.retenir p,.resume p{margin:6px 0 0;font-weight:600}
.resume{border-top:1px dashed var(--line);padding-top:14px;margin-top:20px}
.rappel{background:var(--surf2);border-radius:12px;padding:10px 14px;margin:10px 0}.rappel p{margin:4px 0 0}
.switch{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}.switch input{width:20px;height:20px;accent-color:var(--accent)}
.points{list-style:none;padding:0;margin:10px 0}
.pt{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 44px 12px 16px;margin-bottom:9px}
.term{color:var(--c,var(--accent))}
.flag{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--mut);font-size:17px;min-height:32px;min-width:32px}.flag.on{color:var(--ko)}
.memo .hide{filter:blur(6px);cursor:pointer;transition:filter .25s;user-select:none}.memo .hide.shown{filter:none}
.mind{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.mind svg{position:absolute;inset:0}.mind-l{fill:none;stroke-width:2;opacity:.45}
.mind-c{background:var(--c);color:#fff;font-weight:800;border-radius:14px;padding:10px 14px;text-align:center;max-width:220px}
.mind-n{background:var(--surf);border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:12px;padding:6px 10px;font-size:13.5px;font-weight:600;max-width:28%}
.abs{position:absolute;transform:translate(-50%,-50%)}
.mind-list{display:flex;flex-direction:column;gap:8px;padding:14px}.mind-list .mind-n{max-width:none;margin-left:18px;position:relative}.mind-list .mind-n::before{content:"";position:absolute;left:-14px;top:50%;width:10px;border-top:2px solid var(--c)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0}
.mode{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}.mode b{display:block;margin-bottom:4px}.mode span{font-size:13.5px;color:var(--mut)}
.label{font-size:13.5px;color:var(--mut);font-weight:600;margin:12px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 14px;min-height:38px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.nav2{margin-top:24px}
/* quiz */
.qtop{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:6px 12px}.timer.warn{color:var(--ko);border-color:var(--ko)}
.qcard{background:var(--surf);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:22px;padding:22px;box-shadow:var(--sh);max-width:820px}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mut);font-weight:600;margin-bottom:10px}
.prog{height:6px;border-radius:6px;background:var(--surf2);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--c);transition:width .4s}
.q{font-size:clamp(18px,2.4vw,21px);font-weight:700;line-height:1.4;margin:10px 0 16px}
.cloze{font-weight:600;line-height:2.1}
.blank{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:2px 6px;font-size:16px;margin:0 2px;max-width:100%}
.blank.good,.inp.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surf))}.blank.bad,.inp.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 12%,var(--surf))}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surf);border-radius:14px;padding:13px 16px;min-height:52px;font-weight:600;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surf))}.opt.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 12%,var(--surf))}
.opts.two .opt{text-align:center}
.inp,.sel,textarea,.form input,.form select{width:100%;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:11px 13px;font-size:16px;min-height:46px}
.sel{width:auto}
textarea{min-height:130px;resize:vertical;margin-top:4px}
.corr{margin-top:16px;border-radius:16px;padding:16px 18px;background:var(--surf2);border-left:5px solid var(--mut);animation:fade .25s}
.corr.ok{border-left-color:var(--ok)}.corr.ko{border-left-color:var(--ko)}.corr p{margin:6px 0}
.verdict{font-weight:800;font-size:17px}.corr.ok .verdict{color:var(--ok)}.corr.ko .verdict{color:var(--ko)}
.chosen{padding-left:22px;margin:8px 0;min-height:40px}.chosen li{margin-bottom:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 13px;text-align:left;font-weight:600;min-height:44px}
.tok.on,.tok.sel{border-color:var(--accent);background:var(--accent-soft)}.tok.done{border-style:dashed;border-color:var(--accent)}
.tok.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surf))}.tok.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 12%,var(--surf))}
.pill-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on);font-size:12px;margin-left:6px}
.assoc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}.assoc>div{display:flex;flex-direction:column;gap:8px}
.assoc-res{list-style:none;padding:0}.assoc-res li{padding:9px 12px;border-radius:10px;margin-bottom:6px}.assoc-res .good{background:color-mix(in srgb,var(--ok) 14%,var(--surf))}.assoc-res .bad{background:color-mix(in srgb,var(--ko) 12%,var(--surf))}
.checks label,.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.flip{perspective:1200px;border:0;background:none;padding:0;width:100%;display:block}
.flip .inner{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d}.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);background:var(--surf)}
.face.front{background:color-mix(in srgb,var(--c) 10%,var(--surf))}.face.back{transform:rotateY(180deg);font-size:17px;font-weight:600}
.face .big{font-size:clamp(20px,3vw,26px);font-weight:800}.face small{position:absolute;bottom:12px;color:var(--mut)}
.end{text-align:left}.score{font-size:clamp(48px,9vw,72px);font-weight:800;color:var(--accent);line-height:1}.score small{font-size:.4em;color:var(--mut)}
.err{border-left:4px solid var(--ko);background:var(--surf2);border-radius:0 12px 12px 0;padding:10px 14px;margin:10px 0}
.big-n{font-size:44px;font-weight:800;line-height:1;color:var(--accent)}
.mini-list{margin-top:12px}
.pchap{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
/* planning */
.wk{margin:6px 0 10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.day{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px;font-size:13.5px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day-h{font-weight:800;margin-bottom:6px;text-transform:capitalize}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}.form.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--mut)}.form .full{grid-column:1/-1}
/* stats */
.cols{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;height:170px;align-items:end;margin-top:10px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.cb{width:100%;max-width:28px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s}.cols.alt .cb{background:var(--ok)}
.cv{font-size:11px;color:var(--mut);white-space:nowrap}.cl{font-size:11.5px;color:var(--mut)}
/* outils */
.pomo{text-align:center}.pomo-t{font-size:clamp(48px,8vw,64px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num{width:70px;min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surf);margin:0 4px}
.pomo-mini{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* responsive */
@media(max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
 .side{display:none}
 .mtop{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
 .mtop .logo{width:30px;height:30px;border-radius:9px}
 .ico-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;text-decoration:none;color:var(--mut);font-size:18px}
 main{margin-left:0;padding:16px 16px 100px}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 .bottom a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--mut);font-size:11.5px;font-weight:700;padding:6px 0;border-radius:12px;position:relative}
 .bottom a .ni{font-size:19px}
 .bottom a[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
 .bottom .due-badge{position:absolute;top:2px;right:18%;margin:0;font-size:10.5px;padding:0 6px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .chapters{grid-template-columns:minmax(0,1fr)}
 .form{grid-template-columns:repeat(2,minmax(0,1fr))}
 #toast{bottom:90px}
}
@media(max-width:600px){
 .hero{grid-template-columns:minmax(0,1fr);padding:20px}.hero::after{width:180px;height:180px;right:-70px;top:-70px}.ring-box{display:flex;flex-direction:column;align-items:center;gap:4px;order:-1}.ring{width:150px;height:150px}
 .actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}
 .qcard{padding:16px;border-radius:18px}
 .assoc{grid-template-columns:minmax(0,1fr)}
 .shead{padding:18px;gap:14px}.ico.big{width:52px;height:52px;font-size:22px}
 .cols{gap:3px;height:140px}.cv{font-size:9.5px}
 .form,.form.two{grid-template-columns:minmax(0,1fr)}
}

/* ---- responsive renforcé ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
img,svg{max-width:100%}
@media(hover:none){.subj:hover,.act:hover,.mode:hover,.chap-main:hover{transform:none}.opt:hover:not(:disabled){border-color:var(--line);background:var(--surf)}}
@media(min-width:901px) and (max-width:1180px){.side{width:208px}main{margin-left:208px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:601px) and (max-width:900px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2.tight{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
 .mtop{padding-top:calc(10px + env(safe-area-inset-top,0px))}
 main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
 .qtop{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);margin:0 -16px 8px;padding:6px 16px}
 .qcard{max-width:none}
 .mind-n{max-width:none}
}
@media(max-width:600px){
 h1{font-size:clamp(25px,7.4vw,32px)}
 .card{padding:16px;border-radius:16px}
 .kpi{padding:13px}.kpi span{font-size:12.5px}
 .hero .row .btn{flex:1 1 100%;justify-content:center}
 .chead{padding:18px;border-radius:18px}
 .tabs button{padding:9px 8px;font-size:14px}
 .modes{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .mode{padding:13px}
 .opt{padding:12px 14px}
 .row .btn{min-height:46px}
 .corr .row{gap:8px}
 .day{padding:12px}
 .subjects{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:380px){
 main{padding-left:12px;padding-right:12px}
 .qtop{margin:0 -12px 8px;padding:6px 12px}
 .kpis{gap:8px}.kpi b{font-size:21px}
 .actions,.modes{grid-template-columns:minmax(0,1fr)}
 .bottom a{font-size:10.5px}.bottom a .ni{font-size:18px}
 .assoc{grid-template-columns:minmax(0,1fr)}
 .ring{width:130px;height:130px}
}
@media(max-height:500px) and (orientation:landscape){.bottom{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}.bottom a{flex-direction:row;gap:6px;padding:4px 0}.mtop{position:static}.qtop{position:static}.flip .inner{min-height:180px}}
@media(display-mode:standalone){.mtop{padding-top:calc(12px + env(safe-area-inset-top,0px))}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
